interface:
  display_name: "Video Study Pipeline"
  short_description: "Turn videos into illustrated notes, printable PDFs, and presentation pages"
  default_prompt: "Turn this Bilibili or YouTube video into source-backed study materials. Build an asset-aware Blog-style deep_note.md, then create a separate content and layout brief for every selected output. For HTML, produce an interactive illustrated study page with contextual evidence, semantic subtitles, expandable raw ASR, focused paragraph-level source clips that stop at the evidence boundary and return to reading, local personal notes with Markdown export, search, bookmarks, reading progress, and a polished local-video player with cleaned/raw/off subtitles, 0.75-2x playback speed, bounded seek and skip, volume, fullscreen, keyboard controls, persisted preferences, and an always-visible close button. Cleaned subtitles must cover every raw ASR speech segment; uncovered speech is a hard renderer failure. Keep existing study-model files compatible. PDF and presentation remain optional outputs."
