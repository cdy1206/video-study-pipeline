interface:
  display_name: "Video Study Pipeline"
  short_description: "Video links to V4 learning-note HTML, DeepNote PDF, and presentation outputs"
  default_prompt: "Turn this Bilibili or YouTube video into a transcript-backed study package. Build an asset-aware Blog-style deep_note.md using the V4 learning-unit profile, then create renderer-specific briefs. For HTML, place V4 learning-note content inside the accepted V3 multimodal interaction shell with contextual evidence, semantic transcript, expandable raw ASR, focused paragraph-level source clips that auto-stop and return to reading, local personal notes with Markdown export, search, bookmarks, reading progress, and a polished custom local-video player with raw/cleaned/off subtitles, 0.75-2x playback speed, bounded seek and skip, volume, fullscreen, keyboard controls, persisted preferences, and an always-visible close button. Cleaned subtitles must cover every raw ASR speech segment; uncovered speech is a hard renderer failure. Keep old V3 models compatible. PDF and presentation remain optional output families."
